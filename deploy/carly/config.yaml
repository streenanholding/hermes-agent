# Hermes config for hermes-carly (Carly Finkle, Chief of Staff).
# Seeded to $HERMES_HOME by docker/stage2-hook.sh when HERMES_AGENT_DEPLOY=carly.
# Phase 3: private Telegram and Slack DM lines to Rick only. Rick's Gmail and Calendar are
# READ-ONLY (carly_gmail, carly_calendar read/free_busy). Carly also has her OWN mailbox and
# calendar (carly@finverified.ai): carly_email (draft/send with an allowlist + single-use approval
# tokens) and carly_calendar create_event. All rules live in plugins/carly_google (code).
# No money tools. Scheduled routines (morning brief, weekly plan, Friday wrap) are NOT in this
# file: Hermes cron jobs are not read from config.yaml. Carly creates them with the cronjob tool at
# runtime, or they could be seeded in code like plugins/sol_finance/schedules.py.

_config_version: 38

timezone: America/New_York

model:
  provider: "custom"
  base_url: "https://litellm-gateway-production-774e.up.railway.app/v1"
  # LiteLLM virtual key "carly-cos" from OPENAI_API_KEY in Railway. Budget cap lives in LiteLLM.
  api_key: "${OPENAI_API_KEY}"
  default: "openrouter/anthropic/claude-haiku-4.5"
  max_tokens: 4096

# Capability allowlist. Telegram and Slack (DMs with Rick) in phase 1b.
# Not listed = not available: terminal, process, code_execution, browser,
# delegation, image_gen, video_gen, tts, computer_use.
platform_toolsets:
  slack:
    - web
    - file
    - memory
    - todo
    - cronjob
    - clarify
    - session_search
    - skills
    - carly_google   # carly_gmail + carly_calendar (Rick, read-only) and carly_email + calendar create_event (own mailbox); policy in plugins/carly_google
    - linear # Linear (FinVerified workspace) as Carly's own Linear user; see mcp_servers.linear
  telegram:
    - web
    - file
    - memory
    - todo
    - cronjob
    - clarify
    - session_search
    - skills
    - carly_google   # carly_gmail + carly_calendar (Rick, read-only) and carly_email + calendar create_event (own mailbox); policy in plugins/carly_google
    - linear # Linear (FinVerified workspace) as Carly's own Linear user; see mcp_servers.linear

plugins:
  enabled:
    - carly_google

# Linear (official remote MCP), signed in as Carly's own Linear user via a personal API key.
# LINEAR_API_KEY lives only in Railway variables (hermes-carly). If it is unset the server
# simply fails to connect and Carly keeps working without Linear.
# Allowlist: read everything she needs to track work, plus create/update issues and comments.
# NOT allowed: deletes, labels, documents, sharing, diffs/merges, releases, attachments.
# Charter rule (AGENTS.md): she writes to Linear only after Rick says yes in chat.
mcp_servers:
  linear:
    url: "https://mcp.linear.app/mcp"
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"
    timeout: 60
    connect_timeout: 30
    tools:
      include:
        - list_issues
        - get_issue
        - list_comments
        - list_projects
        - get_project
        - list_teams
        - get_team
        - list_users
        - get_user
        - list_cycles
        - list_issue_statuses
        - get_issue_status
        - list_issue_labels
        - list_milestones
        - get_milestone
        - list_documents
        - get_document
        - get_status_updates
        - list_custom_views
        - get_notifications
        - save_issue
        - save_comment
    resources: false
    prompts: false

tool_loop_guardrails:
  enabled: true
  max_consecutive_identical_calls: 3

memory:
  enabled: true
  memory_char_limit: 4000

max_concurrent_sessions: 2
group_sessions_per_user: true

telemetry:
  enabled: false
updates:
  check: false

# Slack: reply right in the DM (no threads), one running conversation per DM.
platforms:
  slack:
    enabled: true
    gateway_restart_notification: false
    extra:
      reply_in_thread: false
      dm_top_level_threads_as_sessions: false
# Token saver: start a fresh, small conversation after 2 hours of quiet.
# Long-term facts stay in memory; only the chat scrollback is dropped.
session_reset:
  mode: idle
  idle_minutes: 120
  notify: false

# Slack: send only the final answer, no "let me..." play-by-play messages.
display:
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
