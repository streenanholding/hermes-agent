# Hermes config for hermes-carol (Carol Remly — PayVerified connections and payer lead).
# Seeded to $HERMES_HOME by docker/stage2-hook.sh when HERMES_AGENT_DEPLOY=carol.
# Reviewed like code. Credentials in Railway are the enforcement; if this file
# and the credentials disagree, the credentials win.
#
# v1.3: private Telegram line to Rick; her own mailbox carol@finverified.ai (read,
# search, draft, send — approved domains only, Rick and Nancy auto-copied, daily cap);
# the Pay✓erified shared drive only. Web research, her own files, memory, todo, cron.
# Slack DM line to Rick. No money, patient data, production, GitHub or Railway.

_config_version: 37

timezone: America/New_York

model:
  provider: "custom"
  base_url: "https://litellm-gateway-production-774e.up.railway.app/v1"
  # LiteLLM virtual key "carol-payverified" from OPENAI_API_KEY in Railway.
  # Must be referenced explicitly (Hermes ignores OPENAI_API_KEY for non-openai hosts).
  # Budget cap and allowed models live in LiteLLM.
  api_key: "${OPENAI_API_KEY}"
  # Expert judgment is her job, so she runs on Sonnet. Short answers keep cost down.
  default: "openrouter/anthropic/claude-sonnet-4.5"
  max_tokens: 4096

# Capability allowlist. Not listed = not available: terminal, process,
# code_execution, browser, delegation, image_gen, video_gen, tts, computer_use.
platform_toolsets:
  slack:
    - web
    - file
    - memory
    - todo
    - cronjob
    - clarify
    - session_search
    - skills
    - carol_google   # Gmail (CAROL_EMAIL) + Pay✓erified drive; policy enforced in plugins/carol_google
  telegram:
    - web
    - file
    - memory
    - todo
    - cronjob
    - clarify
    - session_search
    - skills
    - carol_google   # Gmail (CAROL_EMAIL) + Pay✓erified drive; policy enforced in plugins/carol_google

plugins:
  enabled:
    - carol_google

# Read by plugins/carol_google (policy switches, never secrets).
carol:
  # Sending on (Rick, 18 Oct 2026). Approved domains: CAROL_SEND_DOMAINS in Railway.
  # Always copied: CAROL_ALWAYS_CC. Set false to go back to drafts only.
  allow_send: true
  daily_send_cap: 40

tool_loop_guardrails:
  enabled: true
  max_consecutive_identical_calls: 3

memory:
  enabled: true
  memory_char_limit: 4000

max_concurrent_sessions: 2
group_sessions_per_user: true

telemetry:
  enabled: false
updates:
  check: false

# Slack: reply right in the DM (no threads), one running conversation per DM.
platforms:
  slack:
    enabled: true
    gateway_restart_notification: false
    extra:
      reply_in_thread: false
      dm_top_level_threads_as_sessions: false
# Token saver: start a fresh, small conversation after 2 hours of quiet.
session_reset:
  mode: idle
  idle_minutes: 120
  notify: false
# Slack: send only the final answer, no play-by-play messages.
display:
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
