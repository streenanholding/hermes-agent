# Hermes config for hermes-agent-2 (v1, dark build: connections & enrollment)
# Lives at $HERMES_HOME/config.yaml on the Railway volume (HERMES_HOME=/opt/data).
# install.sh copies it there. Edit this file by PR, never on the volume.
#
# What Agent 2 CAN do is decided here and by the credentials in its Railway
# environment. CAPABILITIES.md states the intent; this file and the env enforce it.
# No credential appears in this file. Every secret is a Railway variable.

# CONFIRM with Rick before first deploy. Cron schedules below are in this zone.
timezone: "America/New_York"

model:
  # All inference goes through LiteLLM. No direct provider key exists in this
  # service's environment. The virtual key (OPENAI_API_KEY in Railway) carries
  # the weekly budget cap and the allowed-model list, so the cap is enforced
  # upstream of the agent.
  provider: "custom"
  base_url: "https://litellm-gateway-production-774e.up.railway.app/v1"

  # Model ALIASES defined in LiteLLM, one per tier:
  #   agent2-claude-haiku  -> Claude Haiku 4.5   (default: tracking, status, stale checks)
  #   agent2-claude-sonnet -> Claude Sonnet 5.5  (drafts and call briefs, via delegation below)
  #   agent2-claude-opus   -> Claude Opus 5.5    (hard research only; Rick switches with /model)
  # The names must contain "claude": Hermes only turns on prompt caching for a
  # LiteLLM route on the OpenAI wire when the model name is Claude
  # (agent/agent_runtime_helpers.py, anthropic_prompt_cache_policy).
  default: "agent2-claude-haiku"

  # Slack is the surface; keep replies bounded.
  max_tokens: 2048

  # Tags every request in LiteLLM spend logs so this agent's spend can be
  # filtered from Seraphine's. Not a secret.
  default_headers:
    x-litellm-tags: "hermes-agent-2"

# ── Prompt caching ─────────────────────────────────────────────────────────
# SOUL.md, AGENTS.md (the capability contract) and the skill index are a
# stable system-prompt prefix. 1h TTL keeps it cached across the gaps between
# Slack turns, so it's billed at cache-read rates and not in full each time.
prompt_caching:
  cache_ttl: "1h"

# ── Drafting tier: one Sonnet child ────────────────────────────────────────
# The Haiku parent hands drafting (emails, applications, enrollment requests,
# call briefs) to a single child pinned to Sonnet. Children inherit the
# parent's credentials and can only use a subset of the parent's toolsets.
delegation:
  model: "agent2-claude-sonnet"
  max_iterations: 20
  max_concurrent_children: 1
  max_spawn_depth: 1
  orchestrator_enabled: false
  subagent_auto_approve: false

# ── Platform toolsets: THE capability allowlist ────────────────────────────
# Hermes's default `hermes-slack` toolset is FULL access. We replace it with a
# composed list. Not present here = not available on Slack.
platform_toolsets:
  slack:
    - web            # web_search, web_extract: public vendor/payer pages only
    - file           # read/write/patch/search; writes confined by HERMES_WRITE_SAFE_ROOT
    - memory         # durable notes (MEMORY.md)
    - todo           # working list per task
    - clarify        # ask before acting when unsure
    - session_search # find its own prior work
    - skills         # read skills; skill_manage for the payer learning loop
    - delegation     # one Sonnet child for drafts (see delegation above)

  # No other platform is enabled. Telegram, email etc. are intentionally absent.

# ── Explicit denials (belt and braces) ─────────────────────────────────────
# Not in the list above, so not available. Listing them makes the intent
# unmissable in review, and agent.disabled_toolsets also binds cron agents
# and delegated children.
# NOT enabled: terminal, process, code_execution, browser, cronjob,
#              image_gen, video_gen, bfl, tts, computer_use, project, kanban,
#              messaging
agent:
  disabled_toolsets:
    - terminal
    - process
    - code_execution
    - browser
    - cronjob        # jobs come from install.sh in this repo, never from the agent
    - computer_use
    - image_gen
    - video_gen
    - tts
    - messaging

# Agent context: AGENTS.md (= CAPABILITIES.md, copied by install.sh) is read
# from this directory.
terminal:
  cwd: "/opt/data"

# ── Cron ───────────────────────────────────────────────────────────────────
# Every scheduled job is a no_agent script (see cron/jobs.yaml), so cron runs
# cost zero tokens. Agent-driven scheduling stays off.
cron:
  allow_agent_scheduling: false

# ── Guardrails ─────────────────────────────────────────────────────────────
tool_loop_guardrails:
  enabled: true
  max_consecutive_identical_calls: 3   # CAPABILITIES.md: retry at most twice, then stop

# ── Memory ─────────────────────────────────────────────────────────────────
memory:
  enabled: true

# ── Sessions ───────────────────────────────────────────────────────────────
max_concurrent_sessions: 3
group_sessions_per_user: true

# ── No MCP servers in v1 ───────────────────────────────────────────────────
# mcp_servers: {}

# ── Telemetry off ──────────────────────────────────────────────────────────
telemetry:
  enabled: false
updates:
  check: false
