# Hermes config for hermes-casey (Casey Rivera, Partner & Customer Success).
# Seeded to $HERMES_HOME by docker/stage2-hook.sh when HERMES_AGENT_DEPLOY=casey.
# v1: Slack (channels + DMs) and her own mailbox casey@finverified.ai (plugins/casey_google, one user
# OAuth connection, policy in code) plus Attio over REST with a per-agent token (plugins/casey_attio,
# FIN-264). No money, no production, no SMS. Routines (Monday scorecard, Kirk's digest, the 15-minute
# inbox + tasks sweep, Friday wrap) are cron jobs Casey creates at runtime from AGENTS.md; they are
# not read from this file.

_config_version: 37

timezone: America/New_York

model:
  provider: "custom"
  base_url: "https://litellm-gateway-production-774e.up.railway.app/v1"
  # LiteLLM virtual key "casey-success-v1" from OPENAI_API_KEY in Railway. Budget cap lives in LiteLLM.
  api_key: "${OPENAI_API_KEY}"
  default: "openrouter/anthropic/claude-haiku-4.5"
  max_tokens: 4096

# Capability allowlist. Not listed = not available: terminal, process, code_execution, browser,
# delegation, image_gen, video_gen, tts, computer_use.
platform_toolsets:
  slack:
    - web
    - file
    - memory
    - todo
    - cronjob
    - clarify
    - session_search
    - skills
    - casey_google   # casey_email + casey_calendar (own mailbox/calendar; allowlist = team + Attio contacts; approvals)
    - casey_attio    # attio_find_person/company, get/update (fv_* only), add_note, create/complete/my tasks; no delete
    - agent_kb       # kb_search: read-only company knowledge library with citations (FIN-1413)

plugins:
  enabled:
    - casey_google
    - casey_attio
    - agent_kb

tool_loop_guardrails:
  enabled: true
  max_consecutive_identical_calls: 3

memory:
  enabled: true
  memory_char_limit: 4000

max_concurrent_sessions: 3
group_sessions_per_user: true

telemetry:
  enabled: false
updates:
  check: false

# Slack: channel threads keep one conversation per topic; DMs stay flat.
platforms:
  slack:
    enabled: true
    gateway_restart_notification: false
    extra:
      reply_in_thread: true
      dm_top_level_threads_as_sessions: false

# Token saver: start a fresh, small conversation after 2 hours of quiet.
session_reset:
  mode: idle
  idle_minutes: 120
  notify: false

# Slack: send only the final answer, no "let me..." play-by-play messages.
display:
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
